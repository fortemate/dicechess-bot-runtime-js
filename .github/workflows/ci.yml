name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required bootstrap files
        run: |
          for path in README.md LICENSE AGENTS.md CONTRIBUTING.md SECURITY.md docs/architecture.md docs/roadmap.md; do
            test -s "$path"
          done
      - name: Check commit whitespace
        run: git show --format= --check --diff-merges=first-parent HEAD
